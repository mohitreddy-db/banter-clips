<!-- Supabase → Auth → Emails/Templates → "Reset Password" — paste into the body field.
     Subject suggestion:  Reset your BanterClips password -->
<table width="100%" cellpadding="0" cellspacing="0" style="background:#0b0f1c;padding:40px 16px;font-family:Arial,Helvetica,sans-serif;">
  <tr><td align="center">
    <table width="440" cellpadding="0" cellspacing="0" style="background:#131a2b;border:1px solid #232c40;border-radius:16px;padding:36px 32px;">
      <tr><td align="left" style="padding-bottom:20px;">
        <span style="font-size:20px;font-weight:bold;color:#ffffff;">▶ BanterClips</span>
      </td></tr>
      <tr><td style="color:#ffffff;font-size:22px;font-weight:bold;padding-bottom:10px;">
        Reset your password
      </td></tr>
      <tr><td style="color:#8b93a7;font-size:14px;line-height:1.6;padding-bottom:26px;">
        Tap below to choose a new password. If you didn't ask for this, ignore this email — nothing changes.
      </td></tr>
      <tr><td align="center" style="padding-bottom:26px;">
        <a href="{{ .ConfirmationURL }}"
           style="display:inline-block;background:#22d3ee;background-image:linear-gradient(90deg,#22d3ee,#34e27a);color:#06121a;font-size:15px;font-weight:bold;text-decoration:none;padding:14px 34px;border-radius:12px;">
          Choose a new password
        </a>
      </td></tr>
      <tr><td style="color:#4a5468;font-size:12px;line-height:1.6;">
        If the button doesn't work, paste this link into your browser:<br>
        <a href="{{ .ConfirmationURL }}" style="color:#22d3ee;word-break:break-all;">{{ .ConfirmationURL }}</a>
      </td></tr>
    </table>
    <table width="440" cellpadding="0" cellspacing="0"><tr><td style="color:#4a5468;font-size:11px;padding-top:16px;" align="center">
